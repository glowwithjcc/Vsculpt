<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" preserveAspectRatio="none">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a1d06"/>
    <stop offset=".14" stop-color="#9a5218"/>
    <stop offset=".31" stop-color="#e1aa43"/>
    <stop offset=".45" stop-color="#fff0a4"/>
    <stop offset=".56" stop-color="#d18d2d"/>
    <stop offset=".72" stop-color="#7b360d"/>
    <stop offset=".90" stop-color="#f3ca68"/>
    <stop offset="1" stop-color="#4d1d06"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff8cf" stop-opacity=".92"/>
    <stop offset=".5" stop-color="#fff8cf" stop-opacity=".15"/>
    <stop offset="1" stop-color="#fff8cf" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-150%" width="110%" height="400%">
    <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#17070d" flood-opacity=".44"/>
  </filter>
</defs>

<!-- broad ribbon, not a border -->
<path d="M-40 65
 C240 122 500 42 785 78
 C1065 114 1325 42 1640 70
 L1640 116
 C1320 87 1070 150 782 118
 C500 88 235 158 -40 106 Z"
 fill="url(#gold)" filter="url(#shadow)"/>

<!-- bright rolled top lip -->
<path d="M-30 66
 C245 113 500 39 786 74
 C1067 108 1320 39 1630 67"
 fill="none" stroke="url(#shine)" stroke-width="12" stroke-linecap="round"/>

<!-- darker lower rolled edge -->
<path d="M-30 105
 C245 153 505 84 782 116
 C1068 148 1320 84 1630 113"
 fill="none" stroke="#562408" stroke-width="5.5" stroke-linecap="round" opacity=".8"/>
</svg>