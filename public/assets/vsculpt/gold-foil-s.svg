<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 900" preserveAspectRatio="none">
<defs>
  <linearGradient id="front" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3f1906"/>
    <stop offset=".10" stop-color="#7d3a0d"/>
    <stop offset=".24" stop-color="#c9872e"/>
    <stop offset=".39" stop-color="#f4cf76"/>
    <stop offset=".49" stop-color="#fff5ba"/>
    <stop offset=".58" stop-color="#d79a39"/>
    <stop offset=".72" stop-color="#8a4513"/>
    <stop offset=".90" stop-color="#f0c666"/>
    <stop offset="1" stop-color="#5b2808"/>
  </linearGradient>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2e1105"/>
    <stop offset=".35" stop-color="#7b390e"/>
    <stop offset=".72" stop-color="#b66d1e"/>
    <stop offset="1" stop-color="#4a1f08"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff7cf" stop-opacity="0"/>
    <stop offset=".45" stop-color="#fff7cf" stop-opacity=".95"/>
    <stop offset=".58" stop-color="#ffffff" stop-opacity=".65"/>
    <stop offset="1" stop-color="#fff7cf" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-80%" y="-20%" width="260%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#14080f" flood-opacity=".48"/>
  </filter>
</defs>

<!-- dark underside that makes the ribbon feel thick -->
<path d="M154 -30
 C78 73 66 146 134 235
 C192 311 194 368 116 447
 C48 516 45 585 116 670
 C178 744 180 815 112 930
 L165 930
 C226 826 226 744 166 665
 C111 592 111 530 165 458
 C226 375 217 295 158 221
 C100 148 101 83 198 -30 Z"
 fill="url(#back)" filter="url(#shadow)"/>

<!-- broad metallic face -->
<path d="M126 -30
 C59 76 62 154 126 239
 C178 308 174 370 108 443
 C44 513 43 586 108 669
 C164 741 161 812 94 930
 L137 930
 C202 821 205 742 151 671
 C94 596 94 530 146 456
 C201 378 198 307 145 237
 C91 164 93 97 174 -30 Z"
 fill="url(#front)"/>

<!-- bright folded ridge -->
<path d="M117 -22
 C77 76 80 151 132 226
 C170 281 165 353 116 421
 C72 482 69 553 113 621
 C151 680 153 754 112 846"
 fill="none" stroke="url(#shine)" stroke-width="15" stroke-linecap="round" opacity=".9"/>

<!-- razor highlight, like polished foil -->
<path d="M112 -10
 C83 77 88 145 136 215
 C166 258 164 318 132 374"
 fill="none" stroke="#fff5bd" stroke-width="3.2" stroke-linecap="round" opacity=".88"/>

<!-- subtle warm edge -->
<path d="M126 -30
 C59 76 62 154 126 239
 C178 308 174 370 108 443
 C44 513 43 586 108 669
 C164 741 161 812 94 930"
 fill="none" stroke="#d9a34a" stroke-width="2" opacity=".9"/>
</svg>